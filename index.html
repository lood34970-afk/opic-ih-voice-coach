<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OPIc IH Voice Coach</title>
  <style>
    :root { --background: #0f1115; --foreground: #f3f5f7; --card: #181c23; --card-foreground: #f3f5f7; --muted: #252b35; --muted-foreground: #b8c0cc; --border: #333b49; --input: #252b35; --primary: #f3f5f7; --primary-foreground: #111318; --accent: #293140; --accent-foreground: #f3f5f7; --viz-series-1: #7cc7ff; color-scheme: dark; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 16px; }
    body { margin: 0; padding: 24px; background: var(--background); color: var(--foreground); }
    main { max-width: 980px; margin: 0 auto; }
    .card { background: var(--card); color: var(--card-foreground); border: 1px solid var(--border); border-radius: 16px; padding: 16px; }
    .btn { appearance: none; border: 1px solid var(--border); border-radius: 10px; background: var(--muted); color: var(--foreground); padding: 0.55rem 0.85rem; font: inherit; cursor: pointer; }
    .btn:hover { background: var(--accent); }
    .btn-primary { background: var(--primary); color: var(--primary-foreground); border-color: var(--primary); }
    .btn-ghost { background: transparent; }
    .form-label { display: grid; gap: 0.35rem; color: var(--muted-foreground); font-size: 0.92rem; }
    .form-select, .form-control { border: 1px solid var(--border); border-radius: 10px; background: var(--input); color: var(--foreground); padding: 0.5rem 0.65rem; font: inherit; }
    .viz-controls, .viz-row { display: flex; flex-wrap: wrap; gap: 0.55rem; align-items: end; }
    .text-small { font-size: 0.88rem; }
    .text-muted { color: var(--muted-foreground); }
    @media (max-width: 680px) { body { padding: 14px; } }
  </style>
</head>
<body>
<main><div id="opic-ih-voice-coach" class="opic-ih-voice-coach">
  <style>
    #opic-ih-voice-coach { --gap: 0.85rem; color: var(--foreground); }
    #opic-ih-voice-coach .oiv-shell { display: grid; gap: var(--gap); }
    #opic-ih-voice-coach .oiv-top { display: flex; flex-wrap: wrap; gap: 0.65rem; align-items: center; justify-content: space-between; }
    #opic-ih-voice-coach .oiv-status { display: inline-flex; align-items: center; gap: 0.45rem; }
    #opic-ih-voice-coach .oiv-dot { width: 0.72rem; height: 0.72rem; border-radius: 999px; background: var(--muted-foreground); display: inline-block; }
    #opic-ih-voice-coach .oiv-dot.live { background: var(--viz-series-1); box-shadow: 0 0 0 0.35rem color-mix(in srgb, var(--viz-series-1) 20%, transparent); }
    #opic-ih-voice-coach .oiv-main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(230px, 0.8fr); gap: var(--gap); }
    #opic-ih-voice-coach .oiv-call { min-height: 18rem; display: grid; gap: 0.85rem; align-content: center; text-align: center; }
    #opic-ih-voice-coach .oiv-avatar { width: 4.8rem; height: 4.8rem; border-radius: 999px; margin: 0 auto; display: grid; place-items: center; background: color-mix(in srgb, var(--viz-series-1) 22%, var(--card)); color: var(--foreground); }
    #opic-ih-voice-coach .oiv-avatar i { width: 2.1rem; height: 2.1rem; }
    #opic-ih-voice-coach .oiv-line { font-weight: 500; }
    #opic-ih-voice-coach .oiv-subline { color: var(--muted-foreground); min-height: 1.45rem; }
    #opic-ih-voice-coach .oiv-meter { height: 0.45rem; border-radius: 999px; overflow: hidden; background: var(--muted); max-width: 16rem; margin: 0 auto; width: 100%; }
    #opic-ih-voice-coach .oiv-meter-bar { height: 100%; width: 0%; background: var(--viz-series-1); transition: width 140ms ease; }
    #opic-ih-voice-coach .oiv-time { font-weight: 500; }
    #opic-ih-voice-coach .oiv-log { display: grid; gap: 0.5rem; align-content: start; max-height: 20rem; overflow: auto; padding-inline-end: 0.15rem; }
    #opic-ih-voice-coach .oiv-bubble { padding: 0.65rem 0.75rem; border-radius: 0.85rem; background: var(--muted); color: var(--foreground); }
    #opic-ih-voice-coach .oiv-bubble.user { background: color-mix(in srgb, var(--viz-series-1) 14%, var(--muted)); }
    #opic-ih-voice-coach .oiv-bubble strong { font-weight: 500; }
    #opic-ih-voice-coach .oiv-helper { display: grid; gap: var(--gap); grid-template-columns: minmax(0, 0.85fr) minmax(0, 1.15fr); }
    #opic-ih-voice-coach .oiv-feedback-head { display: flex; flex-wrap: wrap; gap: 0.55rem; align-items: center; justify-content: space-between; }
    #opic-ih-voice-coach .oiv-feedback-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 0.35rem; }
    #opic-ih-voice-coach ul { margin: 0.45rem 0 0; padding-inline-start: 1.1rem; color: var(--muted-foreground); }
    #opic-ih-voice-coach #oiv-feedback li { white-space: pre-line; }
    #opic-ih-voice-coach .oiv-mini-list { list-style: none; padding: 0; }
    #opic-ih-voice-coach .oiv-mini-list li + li { margin-top: 0.38rem; }
    #opic-ih-voice-coach .oiv-level-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 0.75rem; }
    #opic-ih-voice-coach .oiv-level-value { font-size: 1.35rem; font-weight: 500; color: var(--foreground); }
    #opic-ih-voice-coach .oiv-level-scale { position: relative; height: 6.7rem; margin-top: 0.8rem; display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); align-items: end; gap: 0.3rem; }
    #opic-ih-voice-coach .oiv-level-column { height: 100%; min-width: 0; display: grid; grid-template-rows: 1fr 1.1rem; align-items: end; gap: 0.3rem; }
    #opic-ih-voice-coach .oiv-level-column span { width: 100%; height: 1.1rem; border-radius: 0.25rem 0.25rem 0.12rem 0.12rem; background: var(--muted); transition: background 180ms ease; }
    #opic-ih-voice-coach .oiv-level-column:nth-child(2) span { height: 1.45rem; }
    #opic-ih-voice-coach .oiv-level-column:nth-child(3) span { height: 1.8rem; }
    #opic-ih-voice-coach .oiv-level-column:nth-child(4) span { height: 2.15rem; }
    #opic-ih-voice-coach .oiv-level-column:nth-child(5) span { height: 2.5rem; }
    #opic-ih-voice-coach .oiv-level-column:nth-child(6) span { height: 2.85rem; }
    #opic-ih-voice-coach .oiv-level-column:nth-child(7) span { height: 3.2rem; }
    #opic-ih-voice-coach .oiv-level-column:nth-child(8) span { height: 3.55rem; }
    #opic-ih-voice-coach .oiv-level-column:nth-child(9) span { height: 3.9rem; }
    #opic-ih-voice-coach .oiv-level-column.reached span { background: var(--viz-series-1); }
    #opic-ih-voice-coach .oiv-level-column.current b { color: var(--foreground); text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 0.2rem; }
    #opic-ih-voice-coach .oiv-level-column b { overflow: hidden; color: var(--muted-foreground); font-size: 0.64rem; font-weight: 500; text-align: center; }
    #opic-ih-voice-coach .oiv-level-marker { position: absolute; bottom: 1.4rem; width: 2px; height: 4.7rem; border-radius: 2px; background: var(--foreground); transform: translateX(-1px); transition: left 260ms ease; pointer-events: none; }
    #opic-ih-voice-coach .oiv-level-marker::before { content: ""; position: absolute; top: -0.3rem; left: 50%; width: 0.65rem; height: 0.65rem; border: 2px solid var(--card); border-radius: 50%; background: var(--foreground); transform: translateX(-50%); }
    #opic-ih-voice-coach .oiv-level-marker[hidden] { display: none; }
    #opic-ih-voice-coach .oiv-level-meta { margin-top: 0.7rem; color: var(--foreground); }
    #opic-ih-voice-coach .oiv-level-reason { min-height: 2.5rem; margin: 0.35rem 0 0; color: var(--muted-foreground); }
    @media (max-width: 680px) {
      #opic-ih-voice-coach .oiv-main, #opic-ih-voice-coach .oiv-helper { grid-template-columns: 1fr; }
      #opic-ih-voice-coach .oiv-call { min-height: 14rem; }
    }
  </style>

  <div class="oiv-shell">
    <div class="oiv-top">
      <div class="oiv-status" aria-live="polite">
        <span id="oiv-dot" class="oiv-dot" aria-hidden="true"></span>
        <span id="oiv-status">내 설문 13개 주제 연습 대기 중</span>
      </div>
      <div class="viz-controls" aria-label="OPIc IH 연습 선택">
        <label class="form-label">문제 유형
          <select id="oiv-topic" class="form-select">
            <option value="random" selected>내 설문 기준 랜덤</option>
            <option value="home">가족과 아파트 거주</option>
            <option value="movie">영화 보기</option>
            <option value="park">공원 가기</option>
            <option value="performance">공연 보기</option>
            <option value="concert">콘서트 보기</option>
            <option value="game">게임하기</option>
            <option value="tv">TV 보기</option>
            <option value="music">음악 감상</option>
            <option value="pet">애완동물 키우기</option>
            <option value="jogging">조깅</option>
            <option value="walking">걷기</option>
            <option value="domestic">국내 여행</option>
            <option value="overseas">해외 여행</option>
          </select>
        </label>
        <label class="form-label">목표 답변
          <select id="oiv-length" class="form-select">
            <option value="75">75초</option>
            <option value="100" selected>100초</option>
            <option value="120">120초</option>
          </select>
        </label>
      </div>
      <div id="oiv-profile" class="text-small text-muted" aria-label="고정 OPIc 설문 조건"></div>
    </div>

    <div class="oiv-main">
      <section class="card oiv-call" aria-label="OPIc IH 마이크 코치">
        <div class="oiv-avatar"><i data-lucide="mic" aria-hidden="true"></i></div>
        <div>
          <div id="oiv-line" class="oiv-line">문제 듣기를 누르면 내 설문에 맞춘 325문항에서 실제처럼 한 주제 5연속 질문이 나옵니다.</div>
          <div id="oiv-subline" class="oiv-subline text-small">답변은 마이크로만 합니다. 텍스트 입력은 없습니다.</div>
        </div>
        <div class="oiv-time" id="oiv-time">00:00</div>
        <div class="oiv-meter" aria-hidden="true"><div id="oiv-meter" class="oiv-meter-bar"></div></div>
        <div class="viz-row" aria-label="연습 버튼">
          <button id="oiv-question" type="button" class="btn btn-primary">문제 듣기</button>
          <button id="oiv-answer" type="button" class="btn">답변 시작</button>
          <button id="oiv-repeat" type="button" class="btn">다시 듣기</button>
          <button id="oiv-stop" type="button" class="btn btn-ghost">종료</button>
        </div>
      </section>

      <section class="card" aria-label="질문과 답변 기록">
        <div class="text-small text-muted">질문과 답변 기록</div>
        <div id="oiv-log" class="oiv-log" aria-live="polite"></div>
      </section>
    </div>

    <div class="oiv-helper">
      <section class="card" aria-labelledby="oiv-level-title">
        <div class="oiv-level-head">
          <div>
            <div class="text-small text-muted">답변별 자동 추정</div>
            <div id="oiv-level-title">예상 OPIc 등급</div>
          </div>
          <strong id="oiv-level-value" class="oiv-level-value" aria-live="polite">대기 중</strong>
        </div>
        <div id="oiv-level-scale" class="oiv-level-scale" role="img" aria-label="답변 후 예상 OPIc 등급이 표시됩니다">
          <div class="oiv-level-column" data-level="NL"><span></span><b>NL</b></div>
          <div class="oiv-level-column" data-level="NM"><span></span><b>NM</b></div>
          <div class="oiv-level-column" data-level="NH"><span></span><b>NH</b></div>
          <div class="oiv-level-column" data-level="IL"><span></span><b>IL</b></div>
          <div class="oiv-level-column" data-level="IM1"><span></span><b>IM1</b></div>
          <div class="oiv-level-column" data-level="IM2"><span></span><b>IM2</b></div>
          <div class="oiv-level-column" data-level="IM3"><span></span><b>IM3</b></div>
          <div class="oiv-level-column" data-level="IH"><span></span><b>IH</b></div>
          <div class="oiv-level-column" data-level="AL"><span></span><b>AL</b></div>
          <div id="oiv-level-marker" class="oiv-level-marker" aria-hidden="true" hidden></div>
        </div>
        <div id="oiv-level-meta" class="oiv-level-meta text-small">첫 답변이 끝나면 자동으로 표시됩니다.</div>
        <p id="oiv-level-reason" class="oiv-level-reason text-small">실제 OPIc 공식 성적이 아닌 연습용 추정치입니다.</p>
      </section>
      <section class="card">
        <div class="oiv-feedback-head">
          <div class="text-small text-muted">IH 피드백</div>
          <div class="oiv-feedback-actions">
            <button id="oiv-feedback-speak" type="button" class="btn btn-ghost text-small">해설 다시 듣기</button>
            <button id="oiv-model-speak" type="button" class="btn btn-ghost text-small" disabled>모범답변 듣기</button>
          </div>
        </div>
        <ul id="oiv-feedback"></ul>
      </section>
    </div>
  </div>

  <script>
    (function () {
      const root = document.getElementById('opic-ih-voice-coach');
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      const surveyProfile = Object.freeze({
        employment: '직장 없음',
        student: '학생 아님',
        recentClass: '최근 수강 경험 5년 이상 없음',
        residence: '가족과 아파트 거주'
      });
      const allowedTopicKeys = Object.freeze([
        'home', 'movie', 'park', 'performance', 'concert', 'game', 'tv',
        'music', 'pet', 'jogging', 'walking', 'domestic', 'overseas'
      ]);
      const topics = {
        home: {
          label: 'Living with family in an apartment',
          questions: [
            'You said that you live with your family in an apartment. Describe your apartment in detail and tell me about your favorite room.',
            'What do you and your family usually do together at home? Walk me through a typical day in your apartment.',
            'Tell me about a memorable experience you had with your family at home. What happened, and why do you remember it?'
          ],
          connectors: ['I live with...', 'What I like most is...', 'At home, we usually...']
        },
        movie: {
          label: 'Watching movies',
          questions: [
            'What kinds of movies do you enjoy watching? Tell me when, where, and how you usually watch them.',
            'Tell me about your favorite movie, actor, or director. What makes that person or movie special to you?',
            'Describe a memorable time when you watched a movie. Who were you with, and what happened?'
          ],
          connectors: ['I am really into...', 'The movie was about...', 'What I remember most is...']
        },
        park: {
          label: 'Going to parks',
          questions: [
            'Describe a park you often visit. Where is it, what does it look like, and what can people do there?',
            'What do you usually do when you go to a park? Tell me about your routine from beginning to end.',
            'Tell me about a memorable or unexpected experience you had at a park.'
          ],
          connectors: ['There is...', 'I usually go there to...', 'One day...']
        },
        performance: {
          label: 'Watching performances',
          questions: [
            'What kinds of performances do you enjoy watching? Tell me how often you watch them and who you go with.',
            'Describe a theater or performance venue you have visited. What was the atmosphere like?',
            'Tell me about the most memorable performance you have seen. What happened on stage, and how did you feel?'
          ],
          connectors: ['I enjoy watching...', 'The venue was...', 'The best part was...']
        },
        concert: {
          label: 'Going to concerts',
          questions: [
            'Tell me about the kinds of concerts you like to attend. Who do you usually go with, and what do you do there?',
            'Describe the atmosphere at a concert you enjoyed. Include the music, the crowd, and the venue.',
            'Tell me about a memorable concert experience. What made it special or unexpected?'
          ],
          connectors: ['I went to see...', 'The atmosphere was...', 'The highlight was...']
        },
        game: {
          label: 'Playing games',
          questions: [
            'What games do you like playing? Describe how, when, and with whom you usually play them.',
            'Tell me about a game you especially enjoy. Explain its rules and what makes it fun.',
            'Tell me about a memorable or exciting moment you had while playing a game.'
          ],
          connectors: ['I usually play...', 'The goal of the game is...', 'At that moment...']
        },
        tv: {
          label: 'Watching TV',
          questions: [
            'What kinds of TV programs do you enjoy watching? Tell me when and where you usually watch them.',
            'Tell me about your favorite TV show or series. What is it about, and why do you like it?',
            'Describe a memorable program or episode you watched on TV.'
          ],
          connectors: ['I usually watch...', 'The show is about...', 'My favorite episode was...']
        },
        music: {
          label: 'Listening to music',
          questions: [
            'What kind of music do you like listening to? When and where do you usually listen to it?',
            'Tell me about your favorite singer, band, or song. Why do you like it?',
            'Describe a memorable experience related to music.'
          ],
          connectors: ['I am really into...', 'Whenever I...', 'It makes me feel...']
        },
        pet: {
          label: 'Taking care of a pet',
          questions: [
            'Tell me about your pet. What does it look like, and what is its personality like?',
            'Describe your daily routine with your pet from morning to night.',
            'Tell me about a funny, difficult, or memorable experience you had with your pet.'
          ],
          connectors: ['My pet is...', 'Every day, I...', 'One funny thing is...']
        },
        jogging: {
          label: 'Jogging',
          questions: [
            'Tell me about your jogging routine. Where, when, and how often do you usually jog?',
            'Describe your favorite place to go jogging. What does the route look like?',
            'Tell me about a memorable or unexpected experience you had while jogging.'
          ],
          connectors: ['I usually jog...', 'My favorite route is...', 'While I was jogging...']
        },
        walking: {
          label: 'Walking',
          questions: [
            'Tell me about your walking routine. Where do you usually go, and how often do you walk?',
            'Describe your favorite place to take a walk. What can you see and hear there?',
            'Tell me about a time when something memorable happened while you were taking a walk.'
          ],
          connectors: ['I usually take a walk...', 'It helps me...', 'One day...']
        },
        domestic: {
          label: 'Domestic travel',
          questions: [
            'Tell me about a domestic trip you took. Where did you go, who did you go with, and what did you do?',
            'Describe a place in Korea that you recommend visiting. What makes it special?',
            'Tell me about a memorable problem or unexpected event you experienced while traveling in Korea.'
          ],
          connectors: ['I went to...', 'The highlight was...', 'Unfortunately...']
        },
        overseas: {
          label: 'Overseas travel',
          questions: [
            'Tell me about an overseas trip you took. Where did you go, who did you go with, and what did you do?',
            'Describe a foreign city or country that left a strong impression on you.',
            'Tell me about a memorable problem or unexpected event you experienced while traveling abroad.'
          ],
          connectors: ['When I traveled to...', 'What surprised me was...', 'On the other hand...']
        }
      };
      root.querySelector('#oiv-profile').textContent = '고정 설문: ' + Object.values(surveyProfile).join(' · ');
      const questionTemplates = [
        "Let's talk about {topic}. First, describe it in as much detail as you can. What is it like, and what makes it different from other things?",
        "I'd like to know more about {topic}. Tell me what you usually do, when you do it, and who you are usually with.",
        "Give me a full description of a place, person, object, or situation connected to {topic}. Try to include specific details.",
        "What is the first thing that comes to mind when you think about {topic}? Explain why it is meaningful to you.",
        "Tell me about your personal preference related to {topic}. What exactly do you like, and what do you not like?",
        "Walk me through your normal routine related to {topic}, from the beginning to the end.",
        "How often do you do something related to {topic}? Tell me about the time, place, and situation.",
        "Tell me about the people you usually interact with when it comes to {topic}. What do you usually talk about or do together?",
        "Describe the atmosphere or mood connected to {topic}. What sounds, sights, or feelings do you associate with it?",
        "What are the most important things to prepare or consider when dealing with {topic}? Explain them one by one.",
        "Now, tell me about a memorable experience you had related to {topic}. Start with when and where it happened.",
        "Tell me about the last time you did something related to {topic}. What happened from start to finish?",
        "Describe a time when something unexpected happened while you were dealing with {topic}.",
        "Tell me about a time when you had a problem related to {topic}. What was the problem, and how did you solve it?",
        "Tell me a detailed story about {topic}. Include the background, what happened, and how you felt afterward.",
        "How was your experience with {topic} different in the past compared with now?",
        "Compare two different ways people experience {topic}. Which one do you prefer and why?",
        "How do young people and older people usually think about {topic}? Give examples.",
        "What has changed the most about {topic} over the last few years?",
        "What do you think {topic} will be like in the future? Explain your prediction.",
        "I'm going to give you a situation. You need information about {topic}. Call someone and ask three or four questions.",
        "Here is a situation. You have a problem related to {topic}. Explain the problem politely and ask for help.",
        "Imagine you need to change a plan related to {topic}. Call the person involved, explain why, and suggest another option.",
        "Imagine there was a mistake related to {topic}. Call customer service or a person in charge and request a solution.",
        "Now let's go deeper. Why did you choose {topic} in your background survey? Give a natural and personal answer."
      ];
      function expandQuestionBank() {
        Object.keys(topics).forEach(function (key) {
          const t = topics[key];
          const seen = {};
          const expanded = [];
          function add(q) {
            if (!seen[q] && expanded.length < 25) {
              seen[q] = true;
              expanded.push(q);
            }
          }
          t.questions.forEach(add);
          questionTemplates.forEach(function (template) {
            add(template.replace(/\{topic\}/g, t.label.toLowerCase()));
          });
          let n = 1;
          while (expanded.length < 25) {
            add('Follow-up question ' + n + ': give a more detailed personal example related to ' + t.label.toLowerCase() + '. What happened, and what did you learn?');
            n += 1;
          }
          t.questions = expanded.slice(0, 25);
        });
      }

        positives.concat(grammar).concat(tips).slice(0, 10).forEach(function (tip) { const li = document.createElement('li'); li.textContent = tip; els.feedback.appendChild(li); });
        lastFeedbackText = positives.concat(grammar).concat(tips).join(' ');
      }
      function renderFeedbackItems(items) {
        const cleanItems = (items || []).map(function (x) { return String(x || '').trim(); }).filter(Boolean);
        els.feedback.innerHTML = '';
        cleanItems.slice(0, 10).forEach(function (tip) {
          const li = document.createElement('li');
          li.textContent = tip;
          els.feedback.appendChild(li);
        });
        lastFeedbackText = cleanItems.join(' ').trim() || '피드백을 생성하지 못했습니다.';
      }
      async function requestDetailedFeedback(answer) {
        if (!answer) return;
        lastModelAnswer = '';
        els.modelSpeak.disabled = true;
        setStatus('GPT 정밀 피드백 생성 중', true);
        renderFeedbackItems(['GPT가 질문 적합도, 문법, 자연스러운 표현, IH 답변 구조를 정밀 분석하는 중입니다.']);
        els.subline.textContent = '정밀 피드백이 생성되면 자동으로 읽어 줍니다.';
        try {
          const response = await fetch('/api/feedback', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              question: lastQuestion,
              answer: answer,
              topic: topic().label,
              targetSeconds: Number(els.length.value),
              answerSeconds: lastAnswerSeconds
            })
          });
          const data = await response.json().catch(function () { return {}; });
          if (!response.ok) throw new Error(data.error || 'GPT feedback failed.');
          renderFeedbackItems(data.items);
          renderAssessment(data.assessment);
          lastModelAnswer = String(data.modelAnswer || '').trim();
          els.modelSpeak.disabled = !lastModelAnswer;
          setStatus('GPT 정밀 피드백 완료', false);
          els.subline.textContent = '피드백을 자동으로 읽는 중입니다. 피드백 정지를 누르면 멈춥니다.';
          if ('speechSynthesis' in window) window.speechSynthesis.cancel();
          stopFeedbackAudio();
          speakFeedback();
        } catch (error) {
          setStatus('GPT 피드백 실패', false);
          els.subline.textContent = (error && error.message) ? error.message : 'GPT 정밀 피드백 생성에 실패했습니다.';
          renderFeedback(answer);
        }
      }
      function stopFeedbackAudio(message) {
        if (feedbackAudio) {
          try { feedbackAudio.pause(); feedbackAudio.currentTime = 0; } catch (error) {}
        }
        if (feedbackAudioUrl) {
          try { URL.revokeObjectURL(feedbackAudioUrl); } catch (error) {}
        }
        feedbackAudio = null;
        feedbackAudioUrl = '';
        feedbackSpeaking = false;
        audioMode = '';
        els.feedbackSpeak.textContent = '해설 다시 듣기';
        els.modelSpeak.textContent = '모범답변 듣기';
        if (message) els.subline.textContent = message;
      }
      function base64ToBlob(base64, mimeType) {
        const binary = atob(base64);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i += 1) bytes[i] = binary.charCodeAt(i);
        return new Blob([bytes], { type: mimeType || 'audio/mpeg' });
      }
      async function speakFeedback() {
        if (feedbackSpeaking && audioMode === 'feedback') {
          stopFeedbackAudio('피드백 읽기를 정지했습니다.');
          return;
        }
        const text = String(lastFeedbackText || '').trim();
        if (!text || text === '아직 들을 피드백이 없습니다. 답변을 종료하면 자세한 피드백이 만들어집니다.') {
          els.subline.textContent = '아직 읽을 피드백이 없습니다. 답변을 종료하면 피드백이 만들어집니다.';
          return;
        }
        await speakCoachText(text, 'feedback');
      }
      async function speakModelAnswer() {
        if (feedbackSpeaking && audioMode === 'modelAnswer') {
          stopFeedbackAudio('모범답변 재생을 정지했습니다.');
          return;
        }
        const text = String(lastModelAnswer || '').trim();
        if (!text) {
          els.subline.textContent = '답변을 종료하면 이 질문의 모범답변이 만들어집니다.';
          return;
        }
        await speakCoachText(text, 'modelAnswer');
      }
      async function speakCoachText(text, mode) {
        stopFeedbackAudio();
        feedbackSpeaking = true;
        audioMode = mode;
        const isModel = mode === 'modelAnswer';
        if (isModel) els.modelSpeak.textContent = '모범답변 정지';
        else els.feedbackSpeak.textContent = '해설 정지';
        setStatus(isModel ? '모범답변 음성 생성 중' : 'OpenAI 피드백 음성 생성 중', true);
        els.subline.textContent = isModel ? '이 질문의 IH 모범답변 음성을 만드는 중입니다.' : '자연스러운 피드백 음성을 만드는 중입니다.';
        try {
          const response = await fetch('/api/speak', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text: text, mode: mode })
          });
          const data = await response.json().catch(function () { return {}; });
          if (!response.ok) throw new Error(data.error || 'OpenAI speech failed.');
          if (!feedbackSpeaking || audioMode !== mode) return;
          const blob = base64ToBlob(data.audioBase64, data.mimeType);
          feedbackAudioUrl = URL.createObjectURL(blob);
          feedbackAudio = new Audio(feedbackAudioUrl);
          feedbackAudio.onended = function () {
            stopFeedbackAudio(isModel ? '모범답변 재생이 끝났습니다.' : '피드백 읽기가 끝났습니다.');
            setStatus('GPT 정밀 피드백 완료', false);
          };
          feedbackAudio.onerror = function () {
            stopFeedbackAudio(isModel ? '모범답변 재생에 실패했습니다. 다시 눌러 주세요.' : '피드백 오디오 재생에 실패했습니다. 다시 눌러 주세요.');
            setStatus('음성 재생 실패', false);
          };
          setStatus(isModel ? '모범답변 듣는 중' : '피드백 읽는 중', false);
          els.subline.textContent = isModel ? 'IH 수준 모범답변을 읽는 중입니다. 한 번 더 누르면 정지합니다.' : 'OpenAI 음성으로 피드백을 읽는 중입니다. 한 번 더 누르면 정지합니다.';
          await feedbackAudio.play();
        } catch (error) {
          stopFeedbackAudio();
          setStatus('음성 준비 완료', false);
          const message = (error && error.message) ? error.message : '음성 생성 또는 재생에 실패했습니다.';
          if (/play\(\)|user|gesture|interact|NotAllowed/i.test(message)) {
            els.subline.textContent = '휴대폰 브라우저가 자동 재생을 막았습니다. 듣기 버튼을 한 번 눌러 주세요.';
          } else {
            els.subline.textContent = message;
          }
        }
      }
      function clearRecognitionRestart() {
        if (recognitionRestartTimer) clearTimeout(recognitionRestartTimer);
        recognitionRestartTimer = null;
        if (stopFallbackTimer) clearTimeout(stopFallbackTimer);
        stopFallbackTimer = null;
      }
      function preferredMimeType() {
        const candidates = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/mpeg'];
        if (!window.MediaRecorder || !MediaRecorder.isTypeSupported) return '';
        return candidates.find(function (type) { return MediaRecorder.isTypeSupported(type); }) || '';
      }
      function filenameFromMime(mimeType) {
        const clean = String(mimeType || '').split(';')[0].toLowerCase();
        if (clean.includes('mp4')) return 'opic-answer.mp4';
        if (clean.includes('mpeg') || clean.includes('mp3')) return 'opic-answer.mp3';
        if (clean.includes('wav')) return 'opic-answer.wav';
        if (clean.includes('ogg')) return 'opic-answer.ogg';
        return 'opic-answer.webm';
      }
      function blobToBase64(blob) {
        return new Promise(function (resolve, reject) {
          const reader = new FileReader();
          reader.onloadend = function () { resolve(String(reader.result || '').split(',')[1] || ''); };
          reader.onerror = reject;
          reader.readAsDataURL(blob);
        });
      }
      function finishAnswer(label, answerText) {
        if (answerFinalized) return;
        answerFinalized = true;
        answerActive = false;
        lastAnswerSeconds = startedAt ? Math.max(0, Math.floor((Date.now() - startedAt) / 1000)) : 0;
        clearRecognitionRestart();
        stopMeter();
        stopClock();
        setStatus(label || '답변 종료', false);
        const answer = String(answerText || liveTranscript || transcript || '').trim();
        transcript = answer;
        liveTranscript = answer;
        questionCanAdvance = true;
        answerHasStarted = false;
        updateQuestionButton();
        if (answer) {
          els.line.textContent = answer;
          addLog('You', answer, true);
        } else {
          addLog('System', 'No speech was recognized clearly enough to transcribe.', false);
        }
        renderFeedback(answer);
        if (answer) {
          els.subline.textContent = 'OpenAI 음성 인식 완료. GPT 정밀 피드백을 생성합니다.';
          requestDetailedFeedback(answer);
        } else {
          els.subline.textContent = 'OpenAI가 음성을 충분히 인식하지 못했습니다. 마이크 위치를 조정하고 다시 시도해 보세요.';
        }
      }
      async function transcribeBlob(blob) {
        setStatus('OpenAI 음성 인식 중', true);
        els.subline.textContent = '녹음 파일을 OpenAI로 보내 transcript를 만드는 중입니다.';
        const audioBase64 = await blobToBase64(blob);
        const response = await fetch('/api/transcribe', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            audioBase64: audioBase64,
            mimeType: blob.type || recordingMimeType || 'audio/webm',
            filename: filenameFromMime(blob.type || recordingMimeType || 'audio/webm'),
            prompt: 'This is an English OPIc practice answer by a Korean speaker. The speaker may mention work, home, neighborhood, family, housework, music, concerts, games, cooking, pets, walking, gym, cycling, travel, camping, parks, shopping, SNS, or phones. Transcribe the spoken English accurately. Do not translate into Korean.'
          })
        });
        const data = await response.json().catch(function () { return {}; });
        if (!response.ok) throw new Error(data.error || 'OpenAI transcription failed.');
        const text = String(data.text || '').trim();
        if (!text) throw new Error('OpenAI returned an empty transcript. audio=' + Math.round(blob.size / 1024) + 'KB, type=' + (blob.type || recordingMimeType || 'unknown') + ', model=' + (data.model || 'unknown'));
        if (data.fallbackUsed) els.subline.textContent = '기본 모델이 비어 있어 Whisper fallback으로 인식했습니다.';
        return text;
      }
      function listen() {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) {
          setStatus('녹음 미지원', false);
          els.subline.textContent = '이 브라우저는 녹음 API를 지원하지 않습니다. Android Chrome 또는 최신 Chrome/Edge를 사용해 주세요.';
          return;
        }
        clearRecognitionRestart();
        transcript = '';
        liveTranscript = '';
        audioChunks = [];
        answerActive = true;
        answerHasStarted = true;
        questionCanAdvance = false;
        manualStopRequested = false;
        answerFinalized = false;
        updateQuestionButton();
        els.line.textContent = '녹음 중... 끝나면 종료를 누르세요.';
        setStatus('답변 녹음 중', true);
        els.subline.textContent = '이제 브라우저 음성 인식이 아니라, 종료 후 OpenAI가 녹음 파일을 인식합니다.';
        navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } }).then(function (stream) {
          const type = preferredMimeType();
          recordingMimeType = type || 'audio/webm';
          mediaStream = stream;
          try { mediaRecorder = type ? new MediaRecorder(stream, { mimeType: type }) : new MediaRecorder(stream); }
          catch (error) { mediaRecorder = new MediaRecorder(stream); }
          mediaRecorder.ondataavailable = function (event) { if (event.data && event.data.size > 0) audioChunks.push(event.data); };
          mediaRecorder.onerror = function () { finishAnswer('녹음 오류', ''); };
          mediaRecorder.onstop = async function () {
            stopMeter();
            stopClock();
            if (mediaStream) mediaStream.getTracks().forEach(function (track) { track.stop(); });
            mediaStream = null;
            try {
              const blob = new Blob(audioChunks, { type: recordingMimeType });
              if (!blob.size) { finishAnswer('녹음 없음', ''); return; }
              if (blob.size < 2500) { throw new Error('녹음 파일이 너무 작습니다: ' + blob.size + ' bytes. 답변 시작 후 2초 이상 말한 뒤 종료해 주세요.'); }
              const text = await transcribeBlob(blob);
              finishAnswer('피드백 준비 완료', text);
            } catch (error) {
              setStatus('OpenAI 인식 실패', false);
              const message = error.message || 'OpenAI 음성 인식에 실패했습니다. Vercel의 OPENAI_API_KEY 설정을 확인해 주세요.';
              addLog('System', message, false);
              els.subline.textContent = message;
              finishAnswer('피드백 제한', '');
            }
          };
          mediaRecorder.start(1000);
          startMeter();
          startClock();
        }).catch(function () {
          answerActive = false;
          questionCanAdvance = false;
          answerHasStarted = false;
          updateQuestionButton();
          setStatus('마이크 권한 필요', false);
          els.subline.textContent = '브라우저의 마이크 권한을 허용한 뒤 다시 눌러 주세요.';
        });
      }
      function stop() {
        if (answerActive && mediaRecorder && mediaRecorder.state !== 'inactive') {
          manualStopRequested = true;
          setStatus('녹음 종료 중', true);
          els.subline.textContent = '녹음을 마치고 OpenAI 음성 인식으로 넘기는 중입니다.';
          try { mediaRecorder.stop(); } catch (error) { finishAnswer('답변 종료', ''); }
          return;
        }
        clearRecognitionRestart();
        if (mediaStream) { mediaStream.getTracks().forEach(function (track) { track.stop(); }); mediaStream = null; }
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        stopFeedbackAudio();
        stopMeter();
        stopClock();
        setStatus('연습 종료', false);
      }      els.question.addEventListener('click', nextQuestion);
      els.answer.addEventListener('click', listen);
      els.repeat.addEventListener('click', function () { if (lastQuestion) speak(lastQuestion); else nextQuestion(); });
      els.stop.addEventListener('click', stop);
      els.feedbackSpeak.addEventListener('click', speakFeedback);
      els.modelSpeak.addEventListener('click', speakModelAnswer);
      els.topic.addEventListener('change', function () { activeTopicKey = els.topic.value === 'random' ? 'home' : els.topic.value; currentSetQueue = []; currentSetTopicKey = ''; lastModelAnswer = ''; els.modelSpeak.disabled = true; questionCanAdvance = true; answerHasStarted = false; updateQuestionButton(); renderLists(); setStatus(els.topic.value === 'random' ? '내 설문 랜덤 모드' : '선택 주제 연습 모드', false); });
      els.length.addEventListener('change', function () { renderFeedback(transcript); });
      updateQuestionButton();
      renderAssessment();
      renderLists();
      if (window.lucide) window.lucide.createIcons({ attrs: { width: 16, height: 16 } });
    })();
  </script>
</div>
